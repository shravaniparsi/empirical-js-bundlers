name: Confirmatory M1 readiness controls
on:
  workflow_dispatch:
  push:
    branches: [codex/realworld-expansion-v1]
    paths:
      - 'scripts/confirmatory-development-cell.mjs'
      - 'scripts/confirmatory-cell-acceptance.mjs'
      - 'scripts/confirmatory-workspace-contract.mjs'
      - 'scripts/prepare-development-profile.mjs'
      - 'profiles/development-v1/**'
      - '.github/workflows/confirmatory-m1-controls.yml'
permissions:
  contents: read
jobs:
  fresh-process-readiness:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tool: [vite, rspack, webpack]
    env:
      PROFILE_REVISION: confirmatory-m1-control
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: profiles/runtime-v1/.node-version
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Prepare reviewed development workspace
        run: |
          node scripts/prepare-production-profile.mjs synthetic xs-50
          workspace=".submission-pilot/xs-50-corrected-confirmatory-m1-control/${{ matrix.tool }}"
          node scripts/prepare-development-profile.mjs '${{ matrix.tool }}' "$workspace"
          npm ci --prefix "$workspace" --include=dev --no-audit --no-fund
      - name: Exercise browser-confirmed fresh-process boundary
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          mkdir -p m1-control-evidence
          node scripts/confirmatory-development-cell.mjs \
            --workspace-root "$GITHUB_WORKSPACE" \
            --workspace ".submission-pilot/xs-50-corrected-confirmatory-m1-control/${{ matrix.tool }}" \
            --evidence-dir "m1-control-evidence/${{ matrix.tool }}" \
            --workload xs-50 \
            --tool '${{ matrix.tool }}' \
            --correctness-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: confirmatory-m1-control-${{ matrix.tool }}
          path: m1-control-evidence/
          if-no-files-found: error
          retention-days: 30

name: Incremental completion correctness v1
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Correctness matrix to run
        required: true
        default: all
        type: choice
        options: [all, synthetic, bulletproof, realworld]
permissions:
  contents: read
jobs:
  negative-controls:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: profiles/runtime-v1/.node-version
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - run: node scripts/incremental-completion-gate.test.mjs
      - run: node scripts/check-incremental-correctness.test.mjs

  synthetic:
    if: github.event.repository.private == false && (inputs.suite == 'all' || inputs.suite == 'synthetic')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        tool: [vite, rspack, esbuild, webpack, rollup]
        size: [xs-50, s-200, m-500, l-2000, xl-5000]
    env:
      PROFILE_REVISION: m3-correctness-${{ matrix.tool }}-${{ matrix.size }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: profiles/runtime-v1/.node-version
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Prepare frozen synthetic profile
        run: node scripts/prepare-production-profile.mjs synthetic '${{ matrix.size }}'
      - name: Install exact tool workspace
        run: npm ci --prefix '.submission-pilot/${{ matrix.size }}-corrected-m3-correctness-${{ matrix.tool }}-${{ matrix.size }}/${{ matrix.tool }}' --include=dev --no-audit --no-fund
      - name: Validate post-edit completion and output identity
        run: |
          mkdir -p incremental-evidence
          node scripts/check-incremental-correctness.mjs \
            '${{ matrix.tool }}' \
            '.submission-pilot/${{ matrix.size }}-corrected-m3-correctness-${{ matrix.tool }}-${{ matrix.size }}/${{ matrix.tool }}' \
            'incremental-evidence/acceptance.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: incremental-correctness-${{ matrix.tool }}-${{ matrix.size }}
          path: incremental-evidence/
          retention-days: 30

  bulletproof:
    if: github.event.repository.private == false && (inputs.suite == 'all' || inputs.suite == 'bulletproof')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        tool: [vite, rspack, esbuild, webpack, rollup]
    env:
      PROFILE_REVISION: m3-correctness-${{ matrix.tool }}-bulletproof
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: profiles/runtime-v1/.node-version
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Prepare frozen Bulletproof React profile
        run: node scripts/prepare-production-profile.mjs realworld app
      - name: Install exact tool workspace
        run: npm ci --prefix '.submission-pilot/bulletproof-corrected-m3-correctness-${{ matrix.tool }}-bulletproof/${{ matrix.tool }}' --include=dev --no-audit --no-fund
      - name: Validate post-edit completion and output identity
        run: |
          mkdir -p incremental-evidence
          node scripts/check-incremental-correctness.mjs \
            '${{ matrix.tool }}' \
            '.submission-pilot/bulletproof-corrected-m3-correctness-${{ matrix.tool }}-bulletproof/${{ matrix.tool }}' \
            'incremental-evidence/acceptance.json' \
            'src/app/index.tsx'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: incremental-correctness-${{ matrix.tool }}-bulletproof
          path: incremental-evidence/
          retention-days: 30

  realworld:
    if: github.event.repository.private == false && (inputs.suite == 'all' || inputs.suite == 'realworld')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        application: [memos, excalidraw]
        tool: [vite, rspack, esbuild, webpack, rollup]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.application == 'memos' && 'usememos/memos' || 'excalidraw/excalidraw' }}
          ref: ${{ matrix.application == 'memos' && '05a2c6db7a3e926c9142a635f42f7af0f078c81d' || '5db42c3ddbbdc44d10120ab2f18e0864d083e268' }}
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: profiles/runtime-v1/.node-version
          cache: npm
      - name: Install correctness harness
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify pinned source and prepare adapter
        run: |
          mkdir -p incremental-evidence
          node scripts/audit-runtime-policy.mjs incremental-evidence/runtime.json
          node scripts/verify-realworld-source.mjs '${{ matrix.application }}' upstream > incremental-evidence/source.json
          if [ '${{ matrix.application }}' = memos ]; then
            node scripts/prepare-memos-adapter.mjs upstream/web adapter-workspace '${{ matrix.tool }}'
          else
            node scripts/prepare-excalidraw-adapter.mjs upstream adapter-workspace '${{ matrix.tool }}'
          fi
          cp adapter-workspace/adapter-preparation.json incremental-evidence/
          cp adapter-workspace/benchmark-profile.json incremental-evidence/
          sha256sum adapter-workspace/package-lock.json > incremental-evidence/package-lock.sha256
      - name: Install exact adapter closure
        working-directory: adapter-workspace
        run: |
          if [ '${{ matrix.application }}' = memos ]; then
            npx --yes npm@11.9.0 ci --include=dev --no-audit --no-fund
          else
            npx --yes npm@11.9.0 ci --include=dev --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          fi
      - name: Validate post-edit completion and output identity
        run: |
          if [ '${{ matrix.application }}' = memos ]; then
            target='src/pages/SignUp.tsx'
          else
            target='packages/excalidraw/components/main-menu/MainMenu.tsx'
          fi
          node scripts/check-incremental-correctness.mjs \
            '${{ matrix.tool }}' \
            adapter-workspace \
            incremental-evidence/acceptance.json \
            "$target"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: incremental-correctness-${{ matrix.application }}-${{ matrix.tool }}
          path: incremental-evidence/
          retention-days: 30

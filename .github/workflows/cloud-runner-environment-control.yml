name: Cloud runner environment control
on:
  workflow_dispatch:
  push:
    branches: [codex/realworld-expansion-v1]
    paths:
      - '.github/workflows/cloud-runner-environment-control.yml'
      - 'scripts/inspect-cloud-macos-runner.mjs'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: profiles/runtime-v1/.node-version
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Inspect target runner without collecting outcomes
        run: node scripts/inspect-cloud-macos-runner.mjs runner-evidence/pre-block.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-runner-environment-control
          path: runner-evidence/
          if-no-files-found: error
          retention-days: 30
